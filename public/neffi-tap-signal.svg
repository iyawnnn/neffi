<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" aria-hidden="true" focusable="false" style="overflow:visible">
  <style>
    .neffi-tap {
      --tap-ink: var(--neffi-ink, #14161B);
      --tap-gray: var(--neffi-gray, #8C95A3);
      --tap-accent: var(--neffi-vermilion, #E8431F);
    }
    .signal-ring {
      fill: none;
      stroke-linecap: round;
      transform-box: view-box;
      transform-origin: 240px 180px;
    }
    .signal-ring-1 { stroke: var(--tap-ink);  stroke-width: 1.5;  opacity: 1; }
    .signal-ring-2 { stroke: var(--tap-gray); stroke-width: 1.25; opacity: .9; }
    .signal-ring-3 { stroke: var(--tap-gray); stroke-width: 1;    opacity: .6; }
    .signal-ring-4 { stroke: var(--tap-gray); stroke-width: 1;    opacity: .35; }
    .tap-center-dot { fill: var(--tap-accent); }
  </style>

  <g class="neffi-tap">
    <g class="signal-rings">
      <path class="signal-ring signal-ring-1" pathLength="100"
            d="M266.78 171.81A28 28 0 1 1 248.19 153.22"/>
      <path class="signal-ring signal-ring-2" pathLength="100"
            d="M188.64 188.13A52 52 0 1 1 231.87 231.36"/>
      <path class="signal-ring signal-ring-3" pathLength="100"
            d="M319.8 185.58A80 80 0 1 1 248.36 100.44"/>
      <path class="signal-ring signal-ring-4" pathLength="100"
            d="M130.45 156.71A112 112 0 1 1 243.91 291.93"/>
    </g>

    <g class="tap-center">
      <circle class="tap-center-dot" cx="240" cy="180" r="5"/>
    </g>
  </g>
</svg>