    <rect width="480" height="288" rx="24" fill="#FFFFFF" filter="url(#card-shadow)"/>
    <rect x=".75" y=".75" width="478.5" height="286.5" rx="23.25" stroke="#DEE0E4" stroke-width="1.5"/>
    <use href="#contactless" x="420" y="28"/>
    <g transform="translate(181.5 102.5) scale(.45) translate(-270 -306)">
      <use href="#neffi-mark"/>
    </g>
