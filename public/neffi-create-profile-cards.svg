<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" fill="none">
  <defs>
    <filter id="card-shadow" x="-15%" y="-20%" width="130%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#111113" flood-opacity=".15"/>
    </filter>
    <g id="contactless" stroke="#111113" stroke-width="4" stroke-linecap="round">
      <path d="M0 18a12 12 0 0 1 0 12M8 12a22 22 0 0 1 0 24M16 6a32 32 0 0 1 0 36M24 0a42 42 0 0 1 0 48"/>
    </g>
    <!-- Original Neffi mark geometry from neffi-mark-ink.svg. -->
    <g id="neffi-mark">
      <path d="M320.216 490.306H270V406.731C270 378.372 274.625 357.429 295.747 336.892C325.227 308.225 380.953 301.824 409.391 335.674C423.557 352.535 426.509 372.368 426.509 393.657V431.407C426.509 454.691 450.486 467.35 467.488 453.34C476.433 445.969 476.964 435.979 476.964 425.205V386.28H526.606V426.46C526.606 489.937 436.76 519.536 392.71 466.782C383.716 456.011 377.733 442.083 377.733 427.855V381.935C377.733 338.43 320.216 343.036 320.216 385.669V490.306Z" fill="#111113"/>
      <circle cx="500.262" cy="335.708" r="29.738" fill="#E64A35"/>
    </g>
  </defs>

  <!-- Back face, rotated clockwise behind the front card. -->
  <g transform="translate(240 155) rotate(10 212.5 145)">
    <rect width="425" height="290" rx="24" fill="#F8F9FA" filter="url(#card-shadow)"/>
    <rect x=".75" y=".75" width="423.5" height="288.5" rx="23.25" stroke="#DEE0E4" stroke-width="1.5"/>
    <use href="#contactless" x="367" y="28"/>
  </g>

  <!-- Front face, counter-rotated with the mark centered on the card. -->
