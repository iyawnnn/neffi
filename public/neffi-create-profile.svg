<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" fill="none">
  <defs>
    <filter id="profile-shadow" x="-25%" y="-15%" width="150%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#111113" flood-opacity=".10"/>
    </filter>
  </defs>

  <!-- A second identity, partially tucked behind the main profile. -->
  <g transform="translate(350 109) rotate(9 119 174)">
    <rect width="238" height="348" rx="22" fill="#F7F8FA" filter="url(#profile-shadow)"/>
    <rect x=".75" y=".75" width="236.5" height="346.5" rx="21.25" stroke="#DEE0E4" stroke-width="1.5"/>
    <circle cx="119" cy="72" r="29" fill="#E8EAEE"/>
