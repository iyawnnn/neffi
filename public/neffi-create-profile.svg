    <path d="M129 109C130 96 140 92 151 92S172 96 173 109" fill="#B7BDC6"/>
    <rect x="101" y="146" width="100" height="10" rx="5" fill="#62646A"/>
    <rect x="112" y="168" width="78" height="7" rx="3.5" fill="#D5D7DC"/>

    <g fill="#F7F8FA" stroke="#E3E5E9" stroke-width="1.5">
      <rect x="85" y="199" width="32" height="32" rx="9"/>
      <rect x="135" y="199" width="32" height="32" rx="9"/>
      <rect x="185" y="199" width="32" height="32" rx="9"/>
    </g>
    <g stroke="#62646A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
