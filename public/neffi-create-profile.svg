    <g fill="#F7F8FA" stroke="#E3E5E9" stroke-width="1.5">
      <rect x="30" y="268" width="242" height="43" rx="10"/>
      <rect x="30" y="325" width="242" height="43" rx="10"/>
    </g>
    <rect x="47" y="283" width="13" height="13" rx="4" fill="#E64A35" fill-opacity=".15"/>
    <rect x="47" y="340" width="13" height="13" rx="4" fill="#DEE0E4"/>
