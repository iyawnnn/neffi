    <rect x="89" y="137" width="60" height="6" rx="3" fill="#DEE0E4"/>
    <g fill="#FFFFFF" stroke="#E3E5E9" stroke-width="1.5">
      <rect x="25" y="185" width="188" height="36" rx="8"/>
      <rect x="25" y="235" width="188" height="36" rx="8"/>
      <rect x="25" y="285" width="188" height="36" rx="8"/>
    </g>
  </g>

  <!-- Digital profile: avatar, identity lines, contact shortcuts and links. -->
