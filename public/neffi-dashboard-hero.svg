    <path d="M660 682V449C660 326 760 226 883 226S1105 326 1105 449V503C1105 550 1139 588 1180 588S1256 552 1256 508V430H1395V500C1395 630 1298 737 1177 737S963 638 963 510V449C963 404 928 368 883 368S803 404 803 449V682"/>
