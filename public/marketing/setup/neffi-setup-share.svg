<svg width="650" height="420" viewBox="0 0 650 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Start sharing with Neffi</title>
  <desc id="desc">The Neffi card held close to a phone, which shows Mika Santos's profile with a Save contact button and two links.</desc>
  <defs>
    <filter id="blurSoft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="blurTight" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>

  <!-- ================= PHONE (public profile) ================= -->
  <g id="phone" transform="translate(372 36) rotate(6)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <rect x="6" y="12" width="180" height="340" rx="30" fill="#6B6052" opacity="0.14" filter="url(#blurSoft)"/>
    <rect x="0" y="0" width="180" height="340" rx="30" fill="#FFFFFF" stroke="#111113" stroke-opacity="0.4" stroke-width="1.4"/>
    <rect x="72" y="10" width="36" height="8" rx="4" fill="#111113" fill-opacity="0.45"/>

    <g id="profile" text-anchor="middle" fill="#111113">
      <!-- avatar -->
      <circle cx="90" cy="76" r="27" fill="#EDE9E2"/>
      <circle cx="90" cy="69" r="9" fill="#CFC7BB"/>
      <path d="M73.2 96.2c3.3-9 9.4-13.2 16.8-13.2s13.5 4.2 16.8 13.2A26.8 26.8 0 0 1 73.2 96.2Z" fill="#CFC7BB"/>

      <text x="90" y="129" font-size="15" font-weight="600">Mika Santos</text>
      <text x="90" y="146" font-size="10.5" fill-opacity="0.55">Brand Designer</text>

      <!-- save contact -->
      <rect x="20" y="164" width="140" height="30" rx="15" fill="#111113"/>
      <text x="90" y="183" font-size="11.5" font-weight="600" fill="#FFFFFF">Save contact</text>

      <!-- links -->
      <g text-anchor="start">
        <rect x="20" y="208" width="140" height="32" rx="10" fill="#FBFAF8" stroke="#111113" stroke-opacity="0.14"/>
        <rect x="20" y="248" width="140" height="32" rx="10" fill="#FBFAF8" stroke="#111113" stroke-opacity="0.14"/>
        <g stroke="#111113" stroke-opacity="0.8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <!-- globe -->
          <circle cx="38" cy="224" r="5"/>
          <path d="M33 224h10M38 219c1.8 1.6 1.8 8.4 0 10M38 219c-1.8 1.6-1.8 8.4 0 10" stroke-width="0.9"/>
          <!-- link -->
          <path d="M36.2 265.8l3.6-3.6M35 263.4l-1.4 1.4a2.6 2.6 0 0 0 3.6 3.6l1.4-1.4M41 266.6l1.4-1.4a2.6 2.6 0 0 0-3.6-3.6l-1.4 1.4"/>
          <!-- chevrons -->
          <path d="M146 220.5l3.5 3.5-3.5 3.5M146 260.5l3.5 3.5-3.5 3.5" stroke-opacity="0.4"/>
        </g>
        <g font-size="10.5">
          <text x="52" y="228">Portfolio</text>
          <text x="52" y="268">LinkedIn</text>
        </g>
      </g>

      <!-- quiet footer -->
      <rect x="66" y="312" width="48" height="3" rx="1.5" fill-opacity="0.14"/>
    </g>
  </g>

  <!-- ================= TAP FOCAL POINT ================= -->
  <g id="tap-cue">
    <path d="M314 207L334 203.5" stroke="#111113" stroke-opacity="0.3" stroke-width="1" stroke-linecap="round"/>
    <circle cx="342" cy="202" r="3.4" fill="#E64A35"/>
  </g>

  <!-- ================= CARD (official Neffi card, scaled 0.82) ================= -->
  <g id="card" transform="translate(58 224) rotate(-8) scale(0.82)">
    <rect x="8" y="14" width="320" height="200" rx="14" fill="#6B6052" opacity="0.2" filter="url(#blurSoft)"/>
    <rect x="3" y="4" width="320" height="200" rx="12" fill="#6B6052" opacity="0.12" filter="url(#blurTight)"/>
    <!-- thickness -->
    <path d="M311.32 2.6H12.2084C5.5705 2.6 0.189453 7.98 0.189453 14.62V194.3C0.189453 200.937 5.5705 206.318 12.2084 206.318H311.32C317.958 206.318 323.339 200.937 323.339 194.3V14.62C323.339 7.98 317.958 2.6 311.32 2.6Z" fill="#DCD9D3"/>
    <!-- Snow surface -->
    <path d="M311.32 0.188965H12.2084C5.5705 0.188965 0.189453 5.57001 0.189453 12.2079V191.887C0.189453 198.524 5.5705 203.906 12.2084 203.906H311.32C317.958 203.906 323.339 198.524 323.339 191.887V12.2079C323.339 5.57001 317.958 0.188965 311.32 0.188965Z" fill="#FFFFFF" stroke="#D2CFC9" stroke-width="0.8"/>
    <g fill="#111113">
      <!-- NFC symbol -->
      <path d="M287.25 29.0201C288.637 30.9287 288.637 33.5139 287.25 35.4226C286.842 35.9842 286.056 36.1089 285.495 35.7008C284.933 35.2929 284.809 34.5068 285.217 33.9452C285.964 32.9171 285.964 31.5255 285.217 30.4975C284.809 29.9358 284.933 29.1497 285.495 28.7419C286.056 28.3337 286.842 28.4584 287.25 29.0201Z"/>
      <path d="M291.657 25.8184C294.43 29.6365 294.43 34.8061 291.657 38.6242C291.248 39.1858 290.463 39.3102 289.901 38.902C289.339 38.4942 289.215 37.708 289.623 37.1464C291.757 34.2097 291.757 30.2329 289.623 27.2962C289.215 26.7346 289.339 25.9484 289.901 25.5406C290.463 25.1324 291.248 25.2568 291.657 25.8184Z"/>
      <path d="M296.063 22.6171C300.224 28.3438 300.224 36.0986 296.063 41.8254C295.655 42.387 294.869 42.5114 294.307 42.1036C293.746 41.6954 293.621 40.9096 294.029 40.348C297.55 35.5022 297.55 28.9402 294.029 24.0945C293.621 23.5329 293.746 22.7471 294.307 22.3389C294.869 21.9311 295.655 22.0554 296.063 22.6171Z"/>
      <path d="M300.469 19.4158C306.017 27.0516 306.017 37.3909 300.469 45.0267C300.061 45.5883 299.275 45.713 298.714 45.3048C298.152 44.897 298.027 44.1109 298.435 43.5492C303.343 36.7945 303.343 27.648 298.435 20.8932C298.027 20.3316 298.152 19.5455 298.714 19.1376C299.275 18.7295 300.061 18.8542 300.469 19.4158Z"/>
      <!-- Neffi symbol -->
      <path d="M139.869 126.956H126V103.85C126 96.0092 127.277 90.2189 133.111 84.541C141.253 76.6153 156.645 74.8453 164.499 84.2042C168.412 88.8659 169.227 94.3492 169.227 100.235V110.672C169.227 117.11 175.85 120.609 180.545 116.736C183.016 114.698 183.163 111.936 183.163 108.957V98.1956H196.874V109.304C196.874 126.854 172.058 135.038 159.892 120.453C157.408 117.475 155.755 113.624 155.755 109.69V96.9941C155.755 84.9661 139.869 86.2395 139.869 98.0267V126.956Z"/>
    </g>
    <!-- Vermilion dot -->
    <circle cx="189.597" cy="84.2137" r="8.2137" fill="#E64A35"/>
  </g>
</svg>
