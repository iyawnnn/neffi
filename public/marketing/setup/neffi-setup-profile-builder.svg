<svg width="700" height="420" viewBox="0 0 700 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Make your Neffi profile yours</title>
  <desc id="desc">A phone showing a simple profile editor for Mika Santos, Brand Designer, with a profile photo tile, a name row and a links tile being added to it.</desc>
  <defs>
    <filter id="blurSoft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="blurTight" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">

    <!-- ================= PHONE / PROFILE EDITOR ================= -->
    <g id="phone">
      <rect x="256" y="34" width="200" height="378" rx="32" fill="#6B6052" opacity="0.14" filter="url(#blurSoft)"/>
      <rect x="250" y="22" width="200" height="380" rx="32" fill="#FFFFFF" stroke="#111113" stroke-opacity="0.4" stroke-width="1.4"/>
      <rect x="330" y="32" width="40" height="9" rx="4.5" fill="#111113" fill-opacity="0.45"/>

      <g id="editor">
        <text x="270" y="74" font-size="14" font-weight="600" fill="#111113">Edit your profile</text>

        <!-- avatar slot -->
        <g id="avatar-slot">
          <circle cx="350" cy="116" r="25" fill="#F6F4F0" stroke="#111113" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="3 3"/>
          <circle cx="350" cy="111" r="7" fill="#DDD7CE"/>
          <path d="M337 131c2.4-7 7.2-10 13-10s10.6 3 13 10" fill="#DDD7CE"/>
          <circle cx="368" cy="134" r="7.5" fill="#111113"/>
          <path d="M368 130.5v7M364.5 134h7" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round"/>
        </g>

        <!-- fields -->
        <g id="fields">
          <g font-size="9" fill="#111113" fill-opacity="0.5">
            <text x="270" y="164">Name</text>
            <text x="270" y="210">Role</text>
            <text x="270" y="256">Bio</text>
            <text x="270" y="310">Links</text>
          </g>
          <g stroke="#111113" stroke-opacity="0.16" stroke-width="1" fill="#FBFAF8">
            <rect x="270" y="170" width="160" height="26" rx="7"/>
            <rect x="270" y="262" width="160" height="34" rx="7"/>
            <rect x="270" y="316" width="160" height="26" rx="7"/>
          </g>
          <!-- active field -->
          <rect x="270" y="216" width="160" height="26" rx="7" fill="#FFFFFF" stroke="#111113" stroke-opacity="0.8" stroke-width="1.2"/>

          <g font-size="12" fill="#111113">
            <text x="281" y="187.5" font-weight="500">Mika Santos</text>
            <text x="281" y="233.5" font-weight="500">Brand Designer</text>
          </g>
          <rect x="370.5" y="222" width="1.6" height="14" rx="0.8" fill="#E64A35"/>

          <g fill="#111113" fill-opacity="0.18">
            <rect x="281" y="272" width="132" height="3.4" rx="1.7"/>
            <rect x="281" y="282" width="96" height="3.4" rx="1.7"/>
          </g>

          <!-- links summary -->
          <g fill="#111113">
            <circle cx="287" cy="329" r="6" fill="#F0EDE7" stroke="#111113" stroke-opacity="0.25" stroke-width="0.8"/>
            <circle cx="296" cy="329" r="6" fill="#F0EDE7" stroke="#111113" stroke-opacity="0.25" stroke-width="0.8"/>
            <circle cx="305" cy="329" r="6" fill="#F0EDE7" stroke="#111113" stroke-opacity="0.25" stroke-width="0.8"/>
            <text x="318" y="333" font-size="11" fill-opacity="0.75">3 added</text>
            <path d="M416 325l4 4-4 4" fill="none" stroke="#111113" stroke-opacity="0.45" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
        </g>

        <!-- save -->
        <rect x="270" y="356" width="160" height="28" rx="14" fill="#111113"/>
        <text x="350" y="374" text-anchor="middle" font-size="11.5" font-weight="600" fill="#FFFFFF">Save profile</text>
      </g>
    </g>

    <!-- ================= PROFILE PIECES ================= -->

    <!-- connector: photo tile into avatar slot -->
    <path d="M222 104C262 92 296 98 320 108" stroke="#111113" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="3 4" stroke-linecap="round"/>

    <!-- 1. profile photo tile -->
    <g id="piece-photo" transform="translate(118 82) rotate(-5)">
      <rect x="3" y="6" width="104" height="122" rx="16" fill="#6B6052" opacity="0.13" filter="url(#blurSoft)"/>
      <rect x="0" y="0" width="104" height="122" rx="16" fill="#FFFFFF" stroke="#DDD8D0" stroke-width="1"/>
      <circle cx="52" cy="50" r="30" fill="#EDE9E2"/>
      <circle cx="52" cy="42" r="10" fill="#CFC7BB"/>
      <path d="M33.5 71.5c3.6-10 10.4-14.5 18.5-14.5s14.9 4.5 18.5 14.5A29.8 29.8 0 0 1 33.5 71.5Z" fill="#CFC7BB"/>
      <rect x="28" y="94" width="48" height="4" rx="2" fill="#111113" fill-opacity="0.7"/>
      <rect x="36" y="103" width="32" height="3" rx="1.5" fill="#111113" fill-opacity="0.2"/>
    </g>

    <!-- 2. name / detail row -->
    <g id="piece-name" transform="translate(432 108) rotate(3)">
      <rect x="3" y="6" width="176" height="54" rx="14" fill="#6B6052" opacity="0.13" filter="url(#blurSoft)"/>
      <rect x="0" y="0" width="176" height="54" rx="14" fill="#FFFFFF" stroke="#DDD8D0" stroke-width="1"/>
      <circle cx="27" cy="27" r="15" fill="#EDE9E2"/>
      <circle cx="27" cy="23" r="5" fill="#CFC7BB"/>
      <path d="M17.6 36.4c1.9-5 5.3-7.4 9.4-7.4s7.5 2.4 9.4 7.4A14.9 14.9 0 0 1 17.6 36.4Z" fill="#CFC7BB"/>
      <text x="51" y="25" font-size="12.5" font-weight="600" fill="#111113">Mika Santos</text>
      <text x="51" y="40" font-size="10" fill="#111113" fill-opacity="0.55">Brand Designer</text>
    </g>

    <!-- 3. links tile -->
    <g id="piece-links" transform="translate(470 222) rotate(-3)">
      <rect x="3" y="6" width="150" height="112" rx="16" fill="#6B6052" opacity="0.13" filter="url(#blurSoft)"/>
      <rect x="0" y="0" width="150" height="112" rx="16" fill="#FFFFFF" stroke="#DDD8D0" stroke-width="1"/>
      <text x="16" y="24" font-size="10" font-weight="600" fill="#111113" fill-opacity="0.55">Links</text>
      <g stroke="#111113" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
        <!-- portfolio (globe) -->
        <circle cx="25" cy="44" r="9" fill="#F6F4F0" stroke-opacity="0.15"/>
        <circle cx="25" cy="44" r="4.6" stroke-opacity="0.8"/>
        <path d="M20.4 44h9.2M25 39.4c1.6 1.5 1.6 7.7 0 9.2M25 39.4c-1.6 1.5-1.6 7.7 0 9.2" stroke-opacity="0.8" stroke-width="0.9"/>
        <!-- calendar -->
        <circle cx="25" cy="67" r="9" fill="#F6F4F0" stroke-opacity="0.15"/>
        <rect x="20.5" y="63" width="9" height="8.5" rx="1.6" stroke-opacity="0.8"/>
        <path d="M20.5 66h9M23 61.6v2.4M27 61.6v2.4" stroke-opacity="0.8" stroke-width="0.9"/>
        <!-- social (at) -->
        <circle cx="25" cy="90" r="9" fill="#F6F4F0" stroke-opacity="0.15"/>
        <circle cx="25" cy="90" r="2" stroke-opacity="0.8"/>
        <path d="M27 90v1c0 1.2 2.2 1.5 2.4-.4A4.6 4.6 0 1 0 27.2 94" stroke-opacity="0.8" stroke-width="0.9"/>
      </g>
      <g font-size="10.5" fill="#111113">
        <text x="42" y="48">Portfolio</text>
        <text x="42" y="71">Book a call</text>
        <text x="42" y="94">Socials</text>
      </g>
    </g>
  </g>
</svg>
